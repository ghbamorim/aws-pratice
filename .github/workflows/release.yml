name: Deploy Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions
          aws-region: us-east-2

      - name: Resolve release commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git init -q
          git remote add origin https://github.com/ghbamorim/aws-pratice.git
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          SHA="$(git rev-parse FETCH_HEAD^{commit})"

          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Release commit is not part of main" >&2
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify release images in ECR
        env:
          IMAGE_TAG: ${{ steps.release.outputs.sha }}
        run: |
          for repository in aws-pratice-api aws-pratice-frontend; do
            aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text > /dev/null
          done

      - name: Deploy through AWS SSM
        env:
          IMAGE_TAG: ${{ steps.release.outputs.sha }}
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids i-078cd92714f6cb663 \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"set -e\",\"curl -fsSL --retry 3 https://raw.githubusercontent.com/ghbamorim/aws-pratice/$IMAGE_TAG/scripts/deploy.sh -o /tmp/aws-pratice-deploy.sh\",\"bash /tmp/aws-pratice-deploy.sh $IMAGE_TAG\"]}" \
            --query 'Command.CommandId' \
            --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-078cd92714f6cb663

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-078cd92714f6cb663 \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
