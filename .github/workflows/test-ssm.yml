name: Test AWS SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-lab-github-deploy-role
          aws-region: us-east-2

      - name: Test SSM connection
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          test -n "$INSTANCE_ID" || {
            echo "Configure EC2_INSTANCE_ID in GitHub Variables"
            exit 1
          }

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo GitHub Actions conectado a EC2 via SSM","hostname"]}' \
            --query 'Command.CommandId' \
            --output text
