name: Deploy

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect OIDC subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/actions/oidc/customization/sub \
            --jq '{use_default, include_claim_keys}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG" \
            ./backend

          docker push "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG"

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG" \
            ./frontend

          docker push "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG"

      - name: Execute SSM deploy
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          aws ssm send-command \
            --document-name pratice-deploy \
            --targets "Key=tag:Name,Values=aws-pratice-app" \
            --parameters "version=$RELEASE_VERSION" \
            --region us-east-2
