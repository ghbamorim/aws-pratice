name: Deploy AWS Lab

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION: us-east-2
      DOMAIN: aws-lab-ghbamorim.duckdns.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy
          aws-region: us-east-2

      - name: Discover EC2 and ECR
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=aws-pratice-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          test -n "$INSTANCE_ID"
          test "$INSTANCE_ID" != "None"
          test "$(wc -w <<< "$INSTANCE_ID")" -eq 1

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Wait for EC2 and SSM
        shell: bash
        run: |
          set -euo pipefail

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi

            echo "Waiting for SSM ($attempt/60)"
            sleep 10
          done

          exit 1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG" \
            ./backend

          docker push \
            "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG"

          docker build \
            -t "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG" \
            ./frontend

          docker push \
            "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG"

      - name: Transfer files and deploy via SSM
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import time

          instance = os.environ["INSTANCE_ID"]
          region = os.environ["AWS_REGION"]
          tag = os.environ["IMAGE_TAG"]

          def aws(*args):
              return subprocess.check_output(
                  ["aws", *args, "--region", region],
                  text=True
              ).strip()

          def send(commands):
              payload = json.dumps({"commands": commands})
              result = json.loads(aws(
                  "ssm", "send-command",
                  "--instance-ids", instance,
                  "--document-name", "AWS-RunShellScript",
                  "--parameters", payload,
                  "--timeout-seconds", "1800",
                  "--output", "json"
              ))
              command_id = result["Command"]["CommandId"]

              deadline = time.monotonic() + 1800

              while time.monotonic() < deadline:
                  try:
                      invocation = json.loads(aws(
                          "ssm", "get-command-invocation",
                          "--command-id", command_id,
                          "--instance-id", instance,
                          "--output", "json"
                      ))
                  except subprocess.CalledProcessError:
                      time.sleep(5)
                      continue

                  status = invocation["Status"]

                  if status == "Success":
                      print(invocation.get("StandardOutputContent", ""), flush=True)
                      return

                  if status in ("Failed", "Cancelled", "TimedOut", "Cancelling"):
                      print(invocation.get("StandardOutputContent", ""), flush=True)
                      print(invocation.get("StandardErrorContent", ""), flush=True)
                      raise RuntimeError(f"SSM command failed: {status}")

                  time.sleep(5)

              raise TimeoutError("SSM command exceeded 1800 seconds")

          send([
              "set -eu",
              "mkdir -p /opt/aws-pratice",
              ": > /opt/aws-pratice/deploy.sh.b64",
              ": > /opt/aws-pratice/compose.prod.yaml.b64"
          ])

          files = {
              "infra/deploy.sh": "deploy.sh",
              "infra/compose.prod.yaml": "compose.prod.yaml"
          }

          for source, target in files.items():
              with open(source, "rb") as f:
                  encoded = base64.b64encode(f.read()).decode("ascii")

              for offset in range(0, len(encoded), 1500):
                  chunk = encoded[offset:offset + 1500]

                  send([
                      "set -eu",
                      f"printf '%s' '{chunk}' >> /opt/aws-pratice/{target}.b64"
                  ])

              send([
                  "set -eu",
                  f"base64 -d /opt/aws-pratice/{target}.b64 > /opt/aws-pratice/{target}",
                  f"rm /opt/aws-pratice/{target}.b64"
              ])

          send([
              "set -eu",
              "chmod 700 /opt/aws-pratice/deploy.sh",
              f"bash /opt/aws-pratice/deploy.sh '{tag}'"
          ])
          PY

      - name: Verify HTTPS
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              "https://${DOMAIN}/" \
              -o /dev/null; then

              echo "HTTPS funcionando: https://${DOMAIN}/"
              exit 0
            fi

            echo "Aguardando HTTPS ($attempt/30)"
            sleep 10
          done

          echo "HTTPS não ficou disponível" >&2
          exit 1
