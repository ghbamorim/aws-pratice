name: Deploy AWS Release

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-pratice-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "242627333067"
  API_REPOSITORY: aws-pratice-api
  FRONTEND_REPOSITORY: aws-pratice-frontend
  INSTANCE_ID: i-0465d056f6a07fb69

jobs:
  deploy:
    name: Build, publish and deploy release
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $RELEASE_TAG"
            exit 1
          fi

          echo "IMAGE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Inspect OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          # Decode the JWT payload without printing the token.
          PAYLOAD=$(printf '%s' "$PAYLOAD" | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d | jq '{
            sub,
            aud,
            repository,
            ref,
            event_name,
            workflow_ref
          }'

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$API_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"

      - name: Deploy release to EC2 using SSM
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          # Generate a shell script executed by SSM on the EC2 instance.
          cat > deploy-ec2.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          cd /opt/aws-pratice

          REGION="us-east-2"
          REGISTRY="242627333067.dkr.ecr.us-east-2.amazonaws.com"
          TAG="__IMAGE_TAG__"

          API_IMAGE="$REGISTRY/aws-pratice-api:$TAG"
          FRONTEND_IMAGE="$REGISTRY/aws-pratice-frontend:$TAG"

          # Stop the existing startup service before changing images.
          systemctl stop aws-pratice.service

          # Persist the release images in the existing Compose file.
          sed -i -E \
            "s|image: $REGISTRY/aws-pratice-api:[^[:space:]]+|image: $API_IMAGE|" \
            docker-compose.yml

          sed -i -E \
            "s|image: $REGISTRY/aws-pratice-frontend:[^[:space:]]+|image: $FRONTEND_IMAGE|" \
            docker-compose.yml

          # Authenticate to ECR and download the release images.
          aws ecr get-login-password --region "$REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

          docker compose pull
          docker compose up -d --remove-orphans

          # Verify that both services are running.
          for attempt in $(seq 1 30); do
            RUNNING=$(docker compose ps --status running --services)

            if echo "$RUNNING" | grep -qx api \
              && echo "$RUNNING" | grep -qx frontend; then

              # Restore systemd supervision for subsequent reboots.
              systemctl reset-failed aws-pratice.service || true
              systemctl start --no-block aws-pratice.service

              echo "Release $TAG deployed successfully."
              docker compose ps
              exit 0
            fi

            sleep 5
          done

          docker compose ps
          docker compose logs --tail 100
          exit 1
          SCRIPT

          sed -i "s|__IMAGE_TAG__|$IMAGE_TAG|g" deploy-ec2.sh

          # Encode the script to avoid shell and JSON escaping issues.
          SCRIPT_BASE64=$(base64 -w 0 deploy-ec2.sh)

          PARAMETERS=$(jq -nc \
            --arg command "echo '$SCRIPT_BASE64' | base64 -d | bash" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1200 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the remote deployment to finish.
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
