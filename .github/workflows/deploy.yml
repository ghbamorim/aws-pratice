name: Deploy Application

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "242627333067"
  EC2_INSTANCE_ID: i-0226db1f7ab4adbb4
  DB_HOST: aws-pratice-postgres.cbwmwcm8yv8g.us-east-2.rds.amazonaws.com
  DB_SECRET_ARN: arn:aws:secretsmanager:us-east-2:242627333067:secret:rds!db-12f24d05-048d-42a5-a4da-8173f5ca714a-e3SUvn

jobs:
  deploy:
    name: Build and deploy release
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-pratice-frontend"

          docker build \
            --tag "$IMAGE:$IMAGE_TAG" \
            ./frontend

          docker push "$IMAGE:$IMAGE_TAG"

      - name: Build and push backend
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-pratice-api"

          docker build \
            --tag "$IMAGE:$IMAGE_TAG" \
            ./backend

          docker push "$IMAGE:$IMAGE_TAG"

      - name: Prepare deployment payload
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          compose = base64.b64encode(
              Path("infra/compose.yaml").read_bytes()
          ).decode("ascii")

          script = base64.b64encode(
              Path("infra/deploy.sh").read_bytes()
          ).decode("ascii")

          commands = [
              "set -eu",
              "mkdir -p /opt/aws-pratice",
              f"printf '%s' '{compose}' | base64 -d > /opt/aws-pratice/compose.yaml",
              f"printf '%s' '{script}' | base64 -d > /opt/aws-pratice/deploy.sh",
              "chmod 700 /opt/aws-pratice/deploy.sh",
              f"export DB_SECRET_ARN='{os.environ['DB_SECRET_ARN']}'",
              f"export DB_HOST='{os.environ['DB_HOST']}'",
              f"export IMAGE_TAG='{os.environ['IMAGE_TAG']}'",
              "bash /opt/aws-pratice/deploy.sh"
          ]

          Path("ssm-parameters.json").write_text(
              json.dumps({"commands": commands})
          )
          PY

      - name: Deploy through AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
