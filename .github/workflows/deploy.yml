name: Deploy AWS

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "242627333067"
  ECR_REGISTRY: 242627333067.dkr.ecr.us-east-2.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        shell: bash
        run: |
          set -euo pipefail

          for service in api frontend; do
            if [ "$service" = "api" ]; then
              context="backend"
            else
              context="frontend"
            fi

            image="$ECR_REGISTRY/aws-pratice-$service"

            docker build \
              -t "$image:${GITHUB_SHA}" \
              -t "$image:latest" \
              "./$context"

            docker push "$image:${GITHUB_SHA}"
            docker push "$image:latest"
          done

      - name: Prepare SSM deployment command
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          commands = [
              "set -eu",
              "install -d -m 700 /opt/aws-pratice",
          ]

          for filename in ("compose.prod.yml", "deploy.sh"):
              path = Path("deploy") / filename
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              destination = f"/opt/aws-pratice/{filename}"

              commands.append(
                  f"printf '%s' '{encoded}' | base64 -d > '{destination}'"
              )

          commands.extend([
              "chmod 600 /opt/aws-pratice/compose.prod.yml",
              "chmod 700 /opt/aws-pratice/deploy.sh",
              "bash /opt/aws-pratice/deploy.sh",
          ])

          Path("ssm-parameters.json").write_text(
              # First-boot Datadog setup can take longer than a normal redeploy.
              json.dumps({"commands": commands, "executionTimeout": ["1200"]})
          )
          PY

      - name: Find EC2 instance
        shell: bash
        run: |
          set -euo pipefail

          instance_id=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=aws-pratice" \
              "Name=tag:Role,Values=api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$instance_id" || "$instance_id" == *$'\t'* ]]; then
            echo "Expected exactly one running API instance. Found: $instance_id"
            exit 1
          fi

          echo "EC2_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          echo "Selected instance: $instance_id"

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$instance_id" \
            --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus}' \
            --output table

      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $command_id"

          # The CLI waiter stops after ~100s; allow time for first-boot SSI setup.
          for attempt in {1..12}; do
            if aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID"; then
              break
            fi

            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text)

            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              Success) break ;;
              *) break ;;
            esac
          done

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)

          if [[ "$status" != "Success" ]]; then

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Details:StatusDetails,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
