name: Deploy AWS Release

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-pratice-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "242627333067"
  API_REPOSITORY: aws-pratice-api
  FRONTEND_REPOSITORY: aws-pratice-frontend

jobs:
  deploy:
    name: Build, publish and deploy release
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[a-zA-Z0-9_.-]{1,126}$ ]]; then
            echo "Release tag must begin with v and be Docker-compatible."
            exit 1
          fi

          echo "IMAGE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover EC2 instance
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=instance-state-name,Values=running" \
              "Name=tag:Name,Values=aws-pratice-app" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          read -r -a IDS <<< "$INSTANCE_IDS"

          if [ "${#IDS[@]}" -ne 1 ]; then
            echo "Expected exactly one running EC2 instance; found ${#IDS[@]}."
            exit 1
          fi

          echo "INSTANCE_ID=${IDS[0]}" >> "$GITHUB_ENV"
          echo "Deploy target: ${IDS[0]}"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$API_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"

      - name: Deploy release to EC2 using SSM
        run: |
          set -euo pipefail

          cat > deploy-ec2.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          cd /opt/aws-pratice

          REGION="us-east-2"
          REGISTRY="242627333067.dkr.ecr.us-east-2.amazonaws.com"
          TAG="__IMAGE_TAG__"

          API_IMAGE="$REGISTRY/aws-pratice-api:$TAG"
          FRONTEND_IMAGE="$REGISTRY/aws-pratice-frontend:$TAG"

          DOMAIN="aws-lab-ghbamorim.duckdns.org"
          CERT_FILE="/opt/aws-pratice/letsencrypt/live/$DOMAIN/fullchain.pem"
          KEY_FILE="/opt/aws-pratice/letsencrypt/live/$DOMAIN/privkey.pem"
          NGINX_CONF="/opt/aws-pratice/nginx/default.conf"

          # Stop startup supervision while deploying.
          systemctl stop aws-pratice.service

          # Update the application image versions.
          sed -i -E \
            "s|image: $REGISTRY/aws-pratice-api:[^[:space:]]+|image: $API_IMAGE|" \
            docker-compose.yml

          sed -i -E \
            "s|image: $REGISTRY/aws-pratice-frontend:[^[:space:]]+|image: $FRONTEND_IMAGE|" \
            docker-compose.yml

          aws ecr get-login-password --region "$REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$REGISTRY"

          docker compose pull
          docker compose up -d --remove-orphans

          # Restore supervision and wait for it to complete.
          systemctl reset-failed aws-pratice.service || true
          systemctl start aws-pratice.service

          # Wait for both containers to be running.
          SERVICES_READY=false

          for attempt in $(seq 1 30); do
            RUNNING=$(docker compose ps --status running --services)

            if echo "$RUNNING" | grep -qx api \
              && echo "$RUNNING" | grep -qx frontend; then
              SERVICES_READY=true
              break
            fi

            echo "Waiting for application services ($attempt/30)..."
            sleep 5
          done

          if [ "$SERVICES_READY" != true ]; then
            echo "Application containers failed to start."
            docker compose ps
            docker compose logs --tail 100
            exit 1
          fi

          # Verify HTTP before checking TLS.
          HTTP_READY=false

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
                --max-time 5 \
                --output /dev/null \
                http://127.0.0.1/; then
              HTTP_READY=true
              break
            fi

            sleep 2
          done

          if [ "$HTTP_READY" != true ]; then
            echo "HTTP validation failed."
            docker compose logs --tail 100 frontend
            exit 1
          fi

          echo "HTTP is responding successfully."

          # Activate TLS only when certificates and configuration exist.
          if [ -s "$CERT_FILE" ] \
            && [ -s "$KEY_FILE" ] \
            && [ -f "$NGINX_CONF" ]; then

            echo "Validating and activating HTTPS..."

            docker compose exec -T frontend nginx -t
            docker compose exec -T frontend nginx -s reload

            HTTPS_READY=false

            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error \
                  --insecure \
                  --max-time 5 \
                  --output /dev/null \
                  https://127.0.0.1/; then
                HTTPS_READY=true
                break
              fi

              echo "Waiting for HTTPS ($attempt/15)..."
              sleep 2
            done

            if [ "$HTTPS_READY" != true ]; then
              echo "HTTPS validation failed."
              docker compose logs --tail 100 frontend
              exit 1
            fi

            echo "HTTPS is responding successfully."
          else
            echo "TLS is not configured yet."
            echo "HTTPS initialization is managed by the SSM association."
          fi

          docker compose ps
          echo "Release $TAG deployed successfully."
          SCRIPT

          sed -i "s|__IMAGE_TAG__|$IMAGE_TAG|g" deploy-ec2.sh

          SCRIPT_BASE64=$(base64 -w 0 deploy-ec2.sh)

          PARAMETERS=$(jq -nc \
            --arg command "echo '$SCRIPT_BASE64' | base64 -d | bash" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1200 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
