name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/aws-pratice-github-actions-role
          aws-region: us-east-2

      - name: Load Terraform outputs
        shell: bash
        run: |
          aws s3 cp \
            s3://aws-pratice-terraform-state-242627333067-us-east-2/infra/terraform.tfstate \
            state.json --only-show-errors

          jq -r '.outputs.deploy_config.value | to_entries[] |
            "\(.key | ascii_upcase)=\(.value)"' state.json >> "$GITHUB_ENV"

          rm state.json

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG" ./backend
          docker push "$ECR_REGISTRY/aws-pratice-api:$IMAGE_TAG"

          docker build -t "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG" ./frontend
          docker push "$ECR_REGISTRY/aws-pratice-frontend:$IMAGE_TAG"

      - name: Send files and deploy
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          COMPOSE=$(base64 -w 0 deploy/docker-compose.prod.yml)
          SCRIPT=$(base64 -w 0 deploy/deploy.sh)

          COMMANDS=$(jq -n \
            --arg compose "$COMPOSE" \
            --arg script "$SCRIPT" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg host "$RDS_HOST" \
            --arg secret "$SECRET_ARN" \
            --arg tag "$IMAGE_TAG" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /opt/aws-pratice",
                ("echo " + $compose + " | base64 -d > /opt/aws-pratice/docker-compose.prod.yml"),
                ("echo " + $script + " | base64 -d > /opt/aws-pratice/deploy.sh"),
                "chmod 700 /opt/aws-pratice/deploy.sh",
                ("cd /opt/aws-pratice && " +
                  "AWS_REGION=" + $region + " " +
                  "ECR_REGISTRY=" + $registry + " " +
                  "DB_HOST=" + $host + " " +
                  "SECRET_ARN='\''" + $secret + "'\'' " +
                  "IMAGE_TAG=" + $tag + " " +
                  "bash ./deploy.sh")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
