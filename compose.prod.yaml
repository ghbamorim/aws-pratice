services:
  api:
    image: ${ECR_REGISTRY}/aws-pratice-api:${IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      AWS_REGION: us-east-2
      S3_BUCKET: ""
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/aws-pratice-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
