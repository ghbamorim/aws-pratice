services:
  api:
    image: ${ECR_REGISTRY}/aws-pratice-api:${IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      AWS_REGION: us-east-2
      S3_BUCKET: ""
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/aws-pratice-frontend:${IMAGE_TAG}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
