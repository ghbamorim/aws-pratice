services:
  api:
    image: ${ECR_REGISTRY}/aws-pratice-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatória}
      AWS_REGION: us-east-2
      S3_BUCKET: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    image: ${ECR_REGISTRY}/aws-pratice-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy

volumes:
  letsencrypt:
  certbot-webroot:
