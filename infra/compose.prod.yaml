services:
  api:
    image: ${ECR_REGISTRY:?ECR_REGISTRY não definido}/aws-pratice-api:${IMAGE_TAG:?IMAGE_TAG não definido}
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL não definido}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY não definido}/aws-pratice-frontend:${IMAGE_TAG:?IMAGE_TAG não definido}
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy
