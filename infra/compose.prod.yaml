services:
  api:
    image: ${ECR_API_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AWS_REGION: us-east-2
      S3_BUCKET: ""
    expose:
      - "8000"

  frontend:
    image: ${ECR_FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
