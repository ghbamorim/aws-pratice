services:
  api:
    image: ${ECR_REGISTRY}/aws-pratice-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    image: ${ECR_REGISTRY}/aws-pratice-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
