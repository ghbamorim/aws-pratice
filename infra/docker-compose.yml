services:
  api:
    image: ${api_image}
    restart: unless-stopped
    env_file:
      - /opt/aws-pratice/api.env
    environment:
      AWS_REGION: "${aws_region}"
      S3_BUCKET: "${s3_bucket}"
    networks:
      - internal

  frontend:
    image: ${frontend_image}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/aws-pratice/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
